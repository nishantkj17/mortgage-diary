<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>PropFolio — Home</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="style.css">
  <script>(function(){if(localStorage.getItem('propfolio-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');})()</script>
</head>
<body>
  <div class="landing-page">
    <header class="landing-header">
      <div class="landing-brand">
        <h1>PropFolio</h1>
        <p class="muted">Your personal finance hub</p>
      </div>
      <button id="landingThemeToggle" class="theme-toggle-btn" title="Toggle theme"></button>
    </header>

    <main class="landing-main">
      <p class="landing-subtitle muted">What would you like to manage today?</p>
      <div class="landing-cards">

        <a href="/index.html" class="landing-card">
          <div class="landing-card-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9.75L12 3l9 6.75V21a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.75z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </div>
          <div class="landing-card-body">
            <h2 class="landing-card-title">Property Management</h2>
            <p class="landing-card-desc muted">Track mortgages, rent, tenants &amp; more across all your properties.</p>
          </div>
          <div class="landing-card-arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
            </svg>
          </div>
        </a>

        <a href="/budget.html" class="landing-card">
          <div class="landing-card-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="7" width="20" height="14" rx="2"/>
              <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
              <line x1="12" y1="12" x2="12" y2="16"/>
              <line x1="10" y1="14" x2="14" y2="14"/>
            </svg>
          </div>
          <div class="landing-card-body">
            <h2 class="landing-card-title">Budget Tracker</h2>
            <p class="landing-card-desc muted">Plan income, expenses &amp; savings goals — all in one place.</p>
          </div>
          <div class="landing-card-arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
            </svg>
          </div>
        </a>

      </div>

      <!-- Quick-add expense FAB -->
      <div class="b-fab-row" style="margin-top:28px">
        <button id="landingFabExpense" class="b-fab" title="Add Expense">+</button>
      </div>
    </main>
  </div>

  <!-- Quick-Add Expense Modal -->
  <div id="lqeModal" class="modal">
    <div class="modal-content b-quick-modal-content">
      <div class="modal-header">
        <h2>Add Expense</h2>
        <button id="lqeClose" class="close-btn">&times;</button>
      </div>
      <div class="modal-body b-quick-modal-body">
        <div class="b-form-field">
          <label>Category</label>
          <select id="lqeCatSel" class="b-select"></select>
          <input id="lqeCatText" class="b-input" placeholder="Or type new category&hellip;" style="margin-top:6px" />
        </div>
        <div class="b-form-field" style="margin-top:12px">
          <label>Description <span class="b-optional">(optional)</span></label>
          <input id="lqeDesc" class="b-input" placeholder="e.g. grocery, Swiggy&hellip;" />
        </div>
        <div class="b-form-field" style="margin-top:12px">
          <label>Amount (&#8377;)</label>
          <input id="lqeAmt" type="number" class="b-input" min="0" step="0.01" placeholder="e.g. 3500" />
        </div>
        <div id="lqeError" style="color:#e74c3c;font-size:13px;margin-top:8px;display:none"></div>
        <div class="b-form-actions" style="margin-top:16px">
          <button id="lqeSave" class="b-save-btn">Save</button>
          <button id="lqeCancel" class="b-cancel-btn">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="lqeToast" style="position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 22px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;transition:opacity 0.25s;z-index:9999"></div>

  <script>
    (function () {
      // ── Theme ──────────────────────────────────────────────────────────────
      const btn = document.getElementById('landingThemeToggle');
      function applyTheme(dark) {
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('propfolio-theme', dark ? 'dark' : 'light');
        btn.textContent = dark ? '☀️' : '🌙';
      }
      btn.textContent = localStorage.getItem('propfolio-theme') === 'dark' ? '☀️' : '🌙';
      btn.addEventListener('click', function () {
        applyTheme(document.documentElement.getAttribute('data-theme') !== 'dark');
      });

      // ── Quick-add expense ──────────────────────────────────────────────────
      var budgetData = null;
      // Node API runs on 5001 locally; on Azure Node IS the server so relative URLs work
      var API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:5001' : '';

      function currentYM() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      }
      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      }
      function showToast(msg) {
        var t = document.getElementById('lqeToast');
        t.textContent = msg; t.style.opacity = '1';
        setTimeout(function () { t.style.opacity = '0'; }, 2200);
      }
      function showError(msg) {
        var el = document.getElementById('lqeError');
        el.textContent = msg; el.style.display = msg ? 'block' : 'none';
      }
      function populateCats(selectedName) {
        var sel = document.getElementById('lqeCatSel');
        sel.innerHTML = '<option value="">-- select --</option>';
        (budgetData.categories || []).forEach(function (c) {
          var o = document.createElement('option');
          o.value = c.name; o.textContent = c.name;
          if (c.name === selectedName) o.selected = true;
          sel.appendChild(o);
        });
      }
      function openModal() {
        showError('');
        populateCats('');
        document.getElementById('lqeCatText').value = '';
        document.getElementById('lqeDesc').value = '';
        document.getElementById('lqeAmt').value = '';
        document.getElementById('lqeModal').classList.add('active');
        document.getElementById('lqeCatSel').focus();
      }
      function closeModal() {
        document.getElementById('lqeModal').classList.remove('active');
      }
      async function loadBudget() {
        var res = await fetch(API_BASE + '/api/budget');
        budgetData = await res.json();
      }
      async function saveExpense() {
        var sel = document.getElementById('lqeCatSel');
        var txt = document.getElementById('lqeCatText').value.trim();
        var cat = txt || sel.value;
        var desc = document.getElementById('lqeDesc').value.trim();
        var amt = parseFloat(document.getElementById('lqeAmt').value);
        if (!cat) { showError('Category is required'); return; }
        if (!amt || amt <= 0) { showError('Enter a valid amount'); return; }
        showError('');
        // Ensure category exists
        if (!budgetData.categories) budgetData.categories = [];
        if (!budgetData.categories.find(function (c) { return c.name === cat; })) {
          budgetData.categories.push({ id: uid(), name: cat });
        }
        // Ensure month exists
        if (!budgetData.months) budgetData.months = {};
        var ym = currentYM();
        if (!budgetData.months[ym]) budgetData.months[ym] = { budget: [], expenses: [] };
        budgetData.months[ym].expenses.push({ id: uid(), category: cat, description: desc, amount: amt });
        // Save
        document.getElementById('lqeSave').disabled = true;
        try {
          var res = await fetch(API_BASE + '/api/budget', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(budgetData)
          });
          if (!res.ok) throw new Error('Save failed');
          closeModal();
          showToast('Expense saved ✓');
        } catch (e) {
          showError('Could not save. Is the server running?');
        } finally {
          document.getElementById('lqeSave').disabled = false;
        }
      }

      document.getElementById('landingFabExpense').addEventListener('click', async function () {
        if (!budgetData) await loadBudget();
        openModal();
      });
      document.getElementById('lqeClose').addEventListener('click', closeModal);
      document.getElementById('lqeCancel').addEventListener('click', closeModal);
      document.getElementById('lqeModal').addEventListener('click', function (e) {
        if (e.target === document.getElementById('lqeModal')) closeModal();
      });
      document.getElementById('lqeSave').addEventListener('click', saveExpense);
      document.getElementById('lqeCatSel').addEventListener('change', function () {
        document.getElementById('lqeCatText').value = '';
      });
    })();
  </script>
</body>
</html>
